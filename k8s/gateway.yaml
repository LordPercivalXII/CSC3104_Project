apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: llm-gateway
spec:
  replicas: 3
  selector:
    matchLabels: {app: gateway}
  strategy:                          # replace pods one at a time, never dropping below 3 ready pods
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      topologySpreadConstraints:       # keep the pods on different nodes, so losing a node loses one pod
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: gateway}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: gateway-config         # smart_ai_gateway/gateway.config, stored once as a ConfigMap
          configMap:
            name: gateway-config       # kustomize adds a hash suffix, so editing the file rolls out new pods
      initContainers:
        # The semantic cache needs its Qdrant collection to exist. Safe to run in every pod:
        # it creates the collection only if missing, and retries until Qdrant answers.
        - name: create-collection
          image: smart-gateway:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until python smart_ai_gateway/scripts/setup_qdrant.py; do echo 'waiting for Qdrant...'; sleep 2; done"]
          env:
            - {name: QDRANT_URL, value: "http://qdrant:6333"}
            - {name: GATEWAY_CONFIG, value: /etc/gateway/gateway.config}
          volumeMounts:
            - {name: gateway-config, mountPath: /etc/gateway, readOnly: true}
      containers:
        - name: gateway
          image: smart-gateway:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: QDRANT_URL, value: "http://qdrant:6333"}   # overrides qdrant_url in gateway.config
            - {name: GATEWAY_CONFIG, value: /etc/gateway/gateway.config}   # every other setting comes from the ConfigMap
          volumeMounts:
            - {name: gateway-config, mountPath: /etc/gateway, readOnly: true}
          lifecycle:
            preStop:                   # give the load balancer a moment to stop sending traffic before shutdown
              exec: {command: ["sleep", "5"]}
          resources:                       # PyTorch + the embedding model need real memory
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1536Mi}
          startupProbe:                    # the model loads when the app starts: allow up to ~3 min
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:                  # ready only if the app answers AND Qdrant is reachable
            exec:
              command:
                - python
                - -c
                - "import os, urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3); u.urlopen(os.environ['QDRANT_URL'] + '/readyz', timeout=3)"
            periodSeconds: 5
            timeoutSeconds: 8
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
---          
apiVersion: v1
kind: Service                              # load balancer in front of the pods
metadata:
  name: gateway
  namespace: llm-gateway
spec:
  type: NodePort                           # LoadBalancer on a cloud cluster
  selector: {app: gateway}
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: llm-gateway
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: llm-gateway
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: gateway}
