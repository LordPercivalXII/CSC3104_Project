# Local Redis for development.
# maxmemory + allkeys-lru: when the cache is full, Redis evicts the least recently
# used entries. Try allkeys-lfu (least frequently used) as an alternative policy.
services:
  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
volumes:
  redis-data:
