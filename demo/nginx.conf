events { worker_connections 1024; }

http {
    # Docker DNS returns each gateway replica. Refresh after replicas are replaced.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream gateways {
        zone gateways 64k;
        server gateway:8000 resolve;
        keepalive 32;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # A queued LLM request may take longer than an individual model call.
            proxy_read_timeout 180s;
            # Do not transparently replay POST requests against another replica.
            proxy_next_upstream off;
        }
    }
}
