global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    scrape_timeout: 4s
    # Scrape every replica directly; scraping the proxy would mix process counters.
    dns_sd_configs:
      - names: [gateway]
        type: A
        port: 8000
        refresh_interval: 5s
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
