apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-locust
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo-locust}
  template:
    metadata:
      labels: {app: demo-locust}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: locust
          image: locustio/locust:2.37.14
          args: [-f, /mnt/locust/locustfile.py, --host, "http://gateway", --web-host, 0.0.0.0]
          # The web UI starts idle. Choose users/ramp-up only after verifying the provider.
          env:
            - {name: DEMO_SCENARIO, value: cache}
            - {name: DEMO_REQUEST_TIMEOUT_SECONDS, value: "180"}
            - {name: DEMO_INTENTS_PATH, value: /mnt/data/intents.json}
            - {name: DEMO_DATA_SEED, value: "1"}
          ports:
            - {name: http, containerPort: 8089}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
          volumeMounts:
            - {name: workload, mountPath: /mnt/locust, readOnly: true}
            - {name: dataset, mountPath: /mnt/data, readOnly: true}
      volumes:
        - name: workload
          configMap: {name: demo-locust-code}
        - name: dataset
          configMap: {name: demo-locust-data}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-locust
spec:
  selector: {app: demo-locust}
  ports:
    - {name: http, port: 8089, targetPort: http}
